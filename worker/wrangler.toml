# Tutor Desk exam server. Deploy: npx wrangler deploy
# The exam password is a secret, never in this file: npx wrangler secret put TEACHER_PASSWORD
name = "tutor-exams"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "tutor-exams"
database_id = "f6057bfb-317b-4ec3-85ca-becd5dc7419a"
migrations_dir = "migrations"

[vars]
ALLOWED_ORIGINS = "https://alimuqaddasm.github.io,http://localhost:8765,http://127.0.0.1:8765"

# The database is in Eastern North America. Run the Worker next to it, so the many small queries stay
# local and only one trip crosses to the user (Ali, 7 Oct: "exam loading and server stuff is pretty slow").
[placement]
region = "aws:us-east-1"
