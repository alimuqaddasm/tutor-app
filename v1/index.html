<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121826">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Tutor Desk (v1)</title>
<script>
/* apply the saved theme and text style before anything paints */
(function(){try{var t=localStorage.getItem("tutor.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);
var f=localStorage.getItem("tutor.font")||"figtree";document.documentElement.setAttribute("data-font",f);
var fam={figtree:"Figtree:wght@400;600;700;800",lexend:"Lexend:wght@400;600;700;800",serif:"Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700;8..60,800"}[f]||"Figtree:wght@400;600;700;800";
document.write('<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family='+fam+'&display=swap">');}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.github.com">
<link rel="stylesheet" href="app.css?v=10">
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" defer></script>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#/">Tutor Desk v1 <small id="who"></small></a>
  <nav class="nav" aria-label="Sections">
    <a href="#/" data-nav="lessons">Lessons</a>
    <a href="#/revise" data-nav="revise">Revise</a>
    <a href="#/videos" data-nav="videos">Videos</a>
    <a href="#/record" data-nav="record">Record</a>
    <a href="#/settings" data-nav="settings">Settings</a>
  </nav>
  <button class="theme" id="theme" type="button" aria-label="Switch light or dark"></button>
  <div class="save" id="save" aria-live="polite"></div>
</div></header>
<main id="app"><div class="empty"><h3>Loading</h3><p>Starting the Tutor Desk.</p></div></main>
<div id="zoom" class="zoom" hidden><button class="btn small" id="zoomx" type="button">Close</button><img id="zimg" alt=""></div>
<div id="toast" class="toast" hidden></div>
<script src="app.js?v=10" defer></script>
</body>
</html>
